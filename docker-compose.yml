# Conecta2 — compose en la raíz para despliegues directos (Portainer usa esta
# ruta por defecto). La misma definición vive en docker/docker-compose.yml.
services:
  conecta2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: conecta2-panel:latest
    container_name: conecta2
    restart: unless-stopped
    ports:
      - "${CONECTA2_PUERTO:-8050}:8050"
    environment:
      TZ: ${CONECTA2_TZ:-America/Bogota}
    volumes:
      # BD, logos y llave de claves (usar ruta ABSOLUTA en Portainer)
      - ${CONECTA2_DATOS:-./datos}:/app/datos
