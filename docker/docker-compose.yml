services:
  conecta2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # nombre distinto por stack (varias empresas en el mismo servidor)
    container_name: ${CONECTA2_CONTENEDOR:-conecta2}
    restart: unless-stopped
    ports:
      # el puerto de afuera se cambia con la variable CONECTA2_PUERTO
      - "${CONECTA2_PUERTO:-8050}:8050"
    environment:
      TZ: ${CONECTA2_TZ:-America/Bogota}
    volumes:
      # BD, logos y llave de claves. En Portainer poner una ruta ABSOLUTA
      # del servidor, por ejemplo: /opt/conecta2/datos
      - ${CONECTA2_DATOS:-./datos}:/app/datos
