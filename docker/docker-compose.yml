services:
  conecta2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: conecta2-panel:latest
    container_name: conecta2
    restart: unless-stopped
    ports:
      - "8050:8050"
    environment:
      TZ: America/Bogota
    volumes:
      # la base de datos, los logos y la llave de claves viven aquí
      - ../datos:/app/datos
